server:
  port: 8080
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: lingxi-platform
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:lingxi}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:lingxi}
    password: ${RABBITMQ_PASSWORD:lingxi123}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  main:
    allow-bean-definition-overriding: false

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.lingxi: INFO
    org.springframework.ai: INFO
    org.springframework.security: WARN

lingxi:
  jwt:
    secret: ${JWT_SECRET:lingxi-default-dev-secret-key-please-change-in-production-0123456789abcdef}
    access-token-ttl-minutes: 120
    refresh-token-ttl-days: 7
  llm:
    provider: ${LLM_PROVIDER:mock}          # mock | openai（OpenAI 兼容协议）
    base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
    api-key: ${OPENAI_API_KEY:sk-demo}
    model: ${OPENAI_MODEL:deepseek-chat}
    temperature: 0.3
    embedding-base-url: ${EMBEDDING_BASE_URL:}
    embedding-api-key: ${EMBEDDING_API_KEY:}
    embedding-model: ${EMBEDDING_MODEL:text-embedding-v3}
    runtime-override: false                  # 管理端 DB 配置可热覆盖
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:lingxi-kb}
  agent:
    max-iterations: 8
    memory-window: 20
    history-max-chars: 24000
  vector:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_PORT:6334}
    collection: lingxi_kb
  ratelimit:
    login-limit: 5
    login-window-seconds: 60
    chat-limit: 30
    chat-window-seconds: 60
  cors:
    allowed-origins: http://localhost:5173,http://localhost:8000,http://127.0.0.1:8000
  seed:
    enabled: ${SEED_ENABLED:true}
